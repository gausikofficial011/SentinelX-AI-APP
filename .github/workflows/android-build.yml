name: Android Build Pipeline

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Assemble Release APK
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./android/SentinelX
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Inject Environment Variables
        run: |
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" > local.properties
          echo "BASE_URL=https://api.sentinelx.local" >> local.properties
          echo "AI_ENGINE_URL=https://ai.sentinelx.local" >> local.properties
          echo "DEMO_MODE=true" >> local.properties
          
      - name: Build Release APK
        run: ./gradlew assembleRelease
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/SentinelX/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
